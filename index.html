<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hangout</title>
<style>
  :root {
    --bg:#1b2230; --panel:#232c3e; --line:#33405a; --text:#e9edf5; --muted:#93a0b8;
    --accent:#6fd0c4; --accent-ink:#0e2a27; --live:#ffb454; --danger:#ff6b7a;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif; }
  button,input { font:inherit; color:inherit; }
  button { border:0; border-radius:8px; padding:10px 16px; cursor:pointer; background:var(--line); }
  button:hover { filter:brightness(1.15); }
  button.primary { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.danger { background:var(--danger); color:#2b0b10; font-weight:600; }
  button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; }
  .hidden { display:none !important; }

  /* Join screen */
  #join { height:100%; display:grid; place-items:center; padding:24px; }
  #join .box { width:100%; max-width:380px; }
  h1 { font-size:30px; margin:0 0 6px; letter-spacing:-0.5px; }
  .sub { color:var(--muted); margin:0 0 26px; }
  label { display:block; color:var(--muted); font-size:13px; margin:16px 0 6px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .divider { text-align:center; color:var(--muted); margin:18px 0 0; font-size:13px; }
  #err { color:var(--danger); min-height:20px; margin-top:14px; font-size:13px; }

  /* Room */
  #room { height:100%; display:grid; grid-template-columns:260px 1fr; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:20px; display:flex; flex-direction:column; gap:18px; }
  .code { background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .code b { font-size:17px; letter-spacing:1px; }
  .code button { padding:5px 10px; font-size:13px; }
  .people { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .people li { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:var(--bg); border:2px solid transparent; transition:border-color .12s; }
  .people li.speaking { border-color:var(--live); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
  .people li.speaking .dot { background:var(--live); }
  .people li.muted .name::after { content:" (muted)"; color:var(--muted); }
  .status { color:var(--muted); font-size:13px; }
  .controls { margin-top:auto; display:flex; flex-direction:column; gap:8px; }

  main { display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:70%; padding:8px 12px; border-radius:12px; background:var(--panel); align-self:flex-start; overflow-wrap:anywhere; }
  .msg.me { align-self:flex-end; background:var(--accent); color:var(--accent-ink); }
  .msg small { display:block; opacity:.7; font-size:12px; }
  .sys { align-self:center; color:var(--muted); font-size:13px; }
  form { display:flex; gap:10px; padding:14px 24px 20px; border-top:1px solid var(--line); }
  form input { flex:1; }
  form button { flex:none; }
  #updateBar { position:fixed; top:12px; right:12px; z-index:10; display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:8px 8px 8px 14px; font-size:14px; }
  #updateBar button { padding:6px 12px; }
  @media (max-width:760px) { #room { grid-template-columns:1fr; grid-template-rows:auto 1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } .controls { flex-direction:row; margin-top:0; } }
</style>
</head>
<body>

<div id="updateBar" class="hidden"><span id="updateText"></span><button id="updateBtn" class="primary"></button></div>

<section id="join">
  <div class="box">
    <h1>Hangout</h1>
    <p class="sub">A private voice and text room for two.</p>
    <label for="name">Your name</label>
    <input id="name" maxlength="24" placeholder="e.g. Sam" autofocus>
    <label>&nbsp;</label>
    <button id="create" class="primary" style="width:100%">Create a room</button>
    <div class="divider">or join your friend's room</div>
    <label for="code">Room code</label>
    <div class="row">
      <input id="code" placeholder="hang-xxxxxx" spellcheck="false">
      <button id="joinBtn" style="flex:none">Join</button>
    </div>
    <div id="err" role="alert"></div>
  </div>
</section>

<section id="room" class="hidden">
  <aside>
    <div>
      <div class="status" style="margin-bottom:6px">Room code</div>
      <div class="code"><b id="roomCode"></b><button id="copy">Copy</button></div>
    </div>
    <div>
      <div class="status" style="margin-bottom:8px" id="status">Waiting for your friend…</div>
      <ul class="people" id="people"></ul>
    </div>
    <div class="controls">
      <button id="mute">Mute mic</button>
      <button id="leave" class="danger">Leave room</button>
    </div>
  </aside>
  <main>
    <div id="log" aria-live="polite"></div>
    <form id="chatForm">
      <input id="chatInput" placeholder="Send a message" autocomplete="off">
      <button class="primary">Send</button>
    </form>
  </main>
  <audio id="remoteAudio" autoplay></audio>
</section>

<script src="node_modules/peerjs/dist/peerjs.min.js"></script>
<script src="renderer.js"></script>
</body>
</html>
